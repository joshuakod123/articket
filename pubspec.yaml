name: articket
description: "Articket — 전시·미술관 아카이빙 & 커스텀 티켓 다이어리"
publish_to: 'none'
version: 0.1.0+1

environment:
  # Color.withValues / toARGB32 를 사용하므로 Flutter 3.27 이상이 필요합니다.
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1      # Bodoni Moda / Space Mono / IBM Plex Sans KR
  sensors_plus: ^5.0.1      # 자이로 홀로그램 반응 (없어도 앱은 동작)
  uuid: ^4.4.0
  image_picker: ^1.1.2
  share_plus: ^11.0.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2  # 티켓·계정·설정 로컬 저장 (탈퇴 시 통째로 삭제)
  crypto: ^3.0.5              # 비밀번호 해시 (기기 안에 평문으로 두지 않기)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # 회절 포일 셰이더. 등록하지 않아도 앱은 죽지 않고 그라디언트로 폴백합니다.
  shaders:
    - shaders/holo_foil.frag

  # ⚠️ 예전에는 이 블록이 통째로 주석이었습니다.
  # 그래서 `assets/logo.png` 를 넣어 두어도 번들에 들어가지 않았고,
  # `Image.asset('assets/logo.png')` 는 실행 중에 조용히 회색 상자가 됐습니다.
  assets:
    - assets/
    # 실제 포스터·텍스처를 넣을 때 아래 두 줄을 살리세요.
    # - assets/posters/
    # - assets/textures/