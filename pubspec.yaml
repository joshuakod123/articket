name: articket
description: "Articket — 전시·미술관 아카이빙 & 커스텀 티켓 다이어리"
publish_to: 'none'
version: 0.1.0+1

environment:
  # Color.withValues / toARGB32 를 사용하므로 Flutter 3.27 이상이 필요합니다.
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1      # Bodoni Moda / Space Mono / IBM Plex Sans KR
  sensors_plus: ^5.0.1      # 자이로 홀로그램 반응 (없어도 앱은 동작)
  uuid: ^4.4.0
  image_picker: ^1.1.2
  share_plus: ^11.0.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # 회절 포일 셰이더. 등록하지 않아도 앱은 죽지 않고 그라디언트로 폴백합니다.
  shaders:
    - shaders/holo_foil.frag

  # 실제 포스터 이미지를 넣을 때 활성화하세요.
  # assets:
  #   - assets/posters/
  #   - assets/textures/